name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: Send every sitemap URL to IndexNow, not only the pages this release adds or re-dates
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PR checks must not replace a queued production deployment. Keep all main
  # pushes and manual deployments in the existing shared production group.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow_urls: ${{ steps.indexnow.outputs.urls }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the case-study date check compares each file's `updated` with its last commit date.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Setup Python for offline renderer checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned image validation dependency
        run: python3 -m pip install Pillow==11.3.0
      - name: Check case-study dates against git
        # Fails when a case study was edited without re-running scripts/stamp-case-study-dates.mjs.
        run: node scripts/stamp-case-study-dates.mjs --check
      - name: Check
        run: npm run check
      - name: Build
        env:
          # Build-time only. The phone number is never in the repository.
          # When the secret is absent, the site builds without phone or WhatsApp controls.
          SITE_PHONE: ${{ secrets.SITE_PHONE }}
        run: npm run build
      - name: Check built site
        env:
          SITE_PHONE: ${{ secrets.SITE_PHONE }}
        run: npm run check:dist
      - name: Names guard (required private list)
        env:
          MW_NAMES: ${{ secrets.MW_NAMES }}
        run: npm run check:names
      - name: Guide release integration checks
        run: npm run check:guide-release
      - name: Guide responsive browser checks
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run check:guide-browser
      - name: Type floors and hero contrast (computed styles in Chrome)
        # Twelve pages (home, projects, a case study, about, faq, and the #30-#32 pages) at five widths: no text under 14px (13px for labels and credits), paragraphs 16px+,
        # and the hero words at 4.5:1 or better against the photograph. ubuntu-latest ships Google Chrome.
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run check:type
      - name: Build origin/main as the no-loss baseline
        # Dorin's rule: nothing on the site may be lost. Main's own build is the baseline, never a hand-kept list.
        if: github.event_name == 'pull_request'
        env:
          SITE_PHONE: ${{ secrets.SITE_PHONE }}
        run: |
          git worktree add --detach ../mw-main-base origin/main
          cd ../mw-main-base
          npm ci
          npm run build
      - name: No-loss guard (sitemap, galleries, media, Lee Broom and project cards, AI layer)
        if: github.event_name == 'pull_request'
        run: npm run check:no-loss
      - name: Check both phone builds
        run: npm run check:phone
      - name: Check analytics on/off fixture builds
        # Production analytics stay off; enabling a real account is a separate configured release.
        run: npm run check:analytics
      - name: Build editorial review
        run: npm run build:review
      - name: Check guide publication boundaries
        run: npm run check:guides
      - name: Upload editorial review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: wallcovering-content-review
          path: dist-review
          retention-days: 7
      - name: IndexNow plan (pages new or re-dated since the live release)
        # Runs before deploy, so the live sitemap is still the previous release. Sends nothing.
        # A failure here only skips the ping; it never holds back the deploy.
        id: indexnow
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          urls=$(node scripts/indexnow-ping.mjs plan dist ${{ inputs.indexnow_all && '--all' || '' }})
          echo "urls=$urls" >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    # Tells Bing and the other IndexNow engines which pages the release just deployed added or re-dated.
    # A separate job, so a failed ping never marks the deployment failed.
    if: github.event_name != 'pull_request' && needs.build.outputs.indexnow_urls != '' && needs.build.outputs.indexnow_urls != '[]'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the ping script and key file
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/indexnow-ping.mjs
            /public/*.txt
          sparse-checkout-cone-mode: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: IndexNow ping
        env:
          INDEXNOW_ENABLED: '1'
          INDEXNOW_URLS: ${{ needs.build.outputs.indexnow_urls }}
        run: node scripts/indexnow-ping.mjs send
