# Cloudflare Worker that reads a wallpaper link for the "Mr Wallcover Atelier" page.
# It serves the two routes the private enquiry API (server/index.ts) serves for the
# room preview, GET /api/link-preview?url= and GET /api/link-image?url=, so the
# feature works on the static GitHub Pages site. See README.md beside this file.
name = "mw-link-preview"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# No KV, D1, R2 or other bindings. The Worker keeps nothing.

[vars]
# Origins allowed to call the Worker from a browser, comma-separated. Set here, not
# in the dashboard: `wrangler deploy` writes the values in this file over any the
# dashboard holds. Add "http://127.0.0.1:4321" for a local `astro dev` site, or use
# `wrangler dev --var ALLOWED_ORIGINS:"http://127.0.0.1:4321"` without editing this file.
ALLOWED_ORIGINS = "https://www.mrwallcover.com"
# Best-effort per-address limit: requests allowed per 10 minutes, counted in each
# Worker isolate separately (see README, "Rate limit").
RATE_LIMIT = "60"

# Workers Logs are off: a log line would hold the pasted wallpaper link. Switch on
# with the block below only while diagnosing a problem.
# [observability]
# enabled = true
